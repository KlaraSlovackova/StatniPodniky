/* Obsah dokumentu */
html{scroll-behavior:smooth}
[data-toc-heading]{scroll-margin-top:32px}
.document-toc{position:fixed;z-index:20;top:40px;left:20px;width:200px;max-height:calc(100dvh - 80px);overflow-y:auto;scrollbar-width:thin;background:#fff;padding:8px 0 12px;color:var(--body)}
.toc-caption{font-size:15px;line-height:1.4;font-weight:700;letter-spacing:.05em;color:var(--muted);list-style:none;pointer-events:none;padding:0 12px 18px;text-transform:uppercase}
.toc-caption::-webkit-details-marker{display:none}
.toc-current{display:none}
.toc-list{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc-list li{margin:3px 0;padding:0}
.toc-list a{display:block;position:relative;padding:10px 11px 10px 14px;margin-left:-1px;border-left:3px solid transparent;border-radius:0 5px 5px 0;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.5;overflow-wrap:break-word;transition:color .16s ease,background .16s ease,border-color .16s ease}
.toc-list .toc-subitem a{padding-left:26px;font-size:13px}
.toc-list a:hover{color:var(--ink);background:#F5F8F7}
.toc-list a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc-list a.is-current{color:#168575;background:#EAF7F4;border-left-color:var(--accent);font-weight:700}
.toc-list a.is-parent{color:var(--ink)}
@media(min-width:1100px){body{padding-left:224px}}
@media(min-width:1100px) and (max-width:1250px){.workspace{grid-template-columns:1fr;gap:25px}.wheelbox{max-width:600px;width:100%;margin:auto}}
@media(max-width:1099px){
 .document-toc{position:sticky;top:0;left:auto;width:auto;max-height:45dvh;margin:0;padding:0 20px;border-bottom:1px solid var(--line);box-shadow:0 3px 10px #2B2B2B0A}
 .toc-caption{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 0;text-transform:none;letter-spacing:0;color:var(--ink)}
 .toc-caption::after{content:'+';margin-left:auto;font-size:22px;font-weight:400}
 .toc-disclosure[open] .toc-caption::after{content:'−'}
 .toc-current{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;letter-spacing:0;font-weight:400;color:var(--muted)}
 .toc-list{padding-bottom:12px}.toc-list a{padding-top:7px;padding-bottom:7px}
 [data-toc-heading]{scroll-margin-top:80px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.strategy-pillar-icon::after{content:'';position:absolute;right:1px;top:2px;width:13px;height:13px;border:3px solid #fff;border-radius:50%;background:var(--pillar-soft)}

<text class="center-title" aria-label="Principy dobré praxe OECD"><tspan x="300" y="319">Principy</tspan><tspan x="300" y="348">dobré praxe</tspan><tspan x="300" y="377">OECD</tspan></text></svg></div><article class="detail is-empty" id="detail" aria-labelledby="title"><div class="detail-top"><h2 id="title" aria-live="polite" aria-atomic="true">Prozkoumejte jednotlivé principy</h2><span class="index" id="index" hidden></span></div><div class="content" id="content" tabindex="0" role="region" aria-labelledby="title"><p>Klikněte na některou výseč kruhu a zobrazte si podrobnosti k vybrané oblasti. Kliknutím mimo kruh se vrátíte k tomuto přehledu.</p></div><div class="controls" id="controls" hidden><span>Principy dobré praxe OECD</span><div><button class="nav" id="prev" aria-label="Předchozí oblast">←</button> <button class="nav" id="next" aria-label="Následující oblast">→</button></div></div></article></section></main><script>const areas=[{"title": "Důvod státního vlastnictví", "lines": ["Důvod státního", "vlastnictví"], "text": "Dle OECD má mít stát politiku státního vlastnictví, která bude vymezovat cíle a důvody pro majetkovou účast ve společnostech a tyto důvody a cíle má pravidelně přezkoumávat a vyhodnocovat. V zemích OECD jsou typickými důvody pro státní vlastnictví:\n\nspolečnost vlastněná státem poskytuje veřejné služby účinněji než soukromé subjekty,\nřešení selhání trhu – trh nedokáže efektivně zajistit určité činnosti (např. přirozené monopoly, velké infrastrukturní projekty),\nstrategické a hospodářské cíle – ochrana bezpečnosti, národních zájmů, strategicky významná odvětví.\n\nPři vytváření a revizi vlastnické politiky by měla vláda získávat informace od veřejnosti i odborníků. Politika má vymezit úlohu státu a stanovit působnost a odpovědnost dalších zapojených státních úřadů. Účelem státního vlastnictví má být maximalizace hodnoty pro společnost.", "color": "#2EB3A1"}, {"title": "Aktivní vlastník", "lines": ["Aktivní", "vlastník"], "text": "Stát by měl při správě vlastnických práv vystupovat jako aktivní a informovaný vlastník, tzn. podílet se na řízení společností transparentními a odpovědnými postupy. Stát má vymezit odpovědnost za výkon vlastnických práv v rámci státních úřadů. OECD doporučuje vlastnickou funkci centralizovat, případně zřídit koordinační subjekt, který bude harmonizovat a koordinovat činnost a opatření státních úřadů. Centralizace má umožnit oddělení výkonu vlastnické funkce od politik prováděných státem a regulace trhu.\n\nMezi hlavní aktivity státu jako informovaného vlastníka patří zastoupení na valných hromadách a vykonávání hlasovacích práv. Pokud stát svá hlasovací práva neuplatní, měl by tento postup odůvodnit. Stát by měl zavést jasné postupy pro nominace a jmenování členů správních orgánů. Dle OECD má stát stanovit mandát společností s majetkovou účastí státu, uvést konkrétně finanční i nefinanční očekávání výkonnosti a také je průběžně sledovat a vyhodnocovat.\n\nVlastnická politika státu by měla stanovit pokyny a zásady pro odměňování členů správních orgánů. OECD považuje za důležité stanovit odměňování ve společnostech způsobem, který bude odpovídat situaci na trhu. Sladit odměňování s tržními podmínkami je důležité z hlediska možnosti angažovat do správních orgánů společností s majetkovou účastí státu vysoce kvalifikované odborníky. Stát má zároveň dbát na rovnováhu v systému odměňování a zamezit tak případnému negativnímu postoji veřejnosti k odměňování ve státním sektoru. Možným způsobem je formální schválení odměn valnou hromadou.\n\nKe sledování cílů má být zřízen systém podávání zpráv, který umožní dohled nad výkonností společností. Dle OECD má být výkonnost společností s majetkovou účastí státu porovnávána s výkonností soukromých společností, a to domácích i zahraničních. Pokud není porovnání společností možné (z důvodu neexistence srovnatelné společnosti), je doporučeno provést srovnání určitých oblastí výkonnosti a činnosti společnosti. Porovnávání je z pohledu OECD důležité zejména v odvětvích, kde není hospodářská soutěž.", "color": "#00ADDB"}, {"title": "Oddělení vlastnictví a regulace", "lines": ["Oddělení", "vlastnictví", "a regulace"], "text": "Dle OECD má být jasně oddělena funkce státu jako vlastníka společnosti a funkce státu jako tvůrce politik. Oddělení odpovědností v těchto oblastech má být úplné a transparentní, aby byla podporována hospodářská soutěž a byly zajištěny rovné podmínky na trhu. Stát by společnostem s majetkovou účastí státu neměl poskytovat neoprávněné výhody v daňové nebo správní oblasti nebo rozdílný přístup ke státním zárukám, kapitálovému a dluhovému financování oproti podmínkám pro soukromé společnosti. Pokud se společnosti s majetkovou účastí státu účastní zadávání veřejných zakázek (a to jako uchazeči i zadavatelé), měla by být jejich účast transparentní. Měla by být podporována rozmanitost dodavatelů a postupy zadávání zakázek by měly být založeny na objektivních a spravedlivých kritériích.", "color": "#7B61AA"}, {"title": "Ochrana investorů", "lines": ["Ochrana", "investorů"], "text": "Stát má zajistit, aby ostatní společníci a investoři měli stejná práva a stejný přístup k informacím o společnosti. OECD doporučuje vytvořit pokyny, které by upravovaly rovné zacházení s ostatními společníky. Společnosti s majetkovou účastí státu by měly veškeré zásadní informace týkající se společnosti oznamovat všem společníkům současně. Zároveň by měly být informace o vývoji společnosti podávány průběžně, nikoliv pouze formou pravidelných zpráv. Společnosti by měly nastavit způsob komunikace se všemi společníky.\n\nTransakce mezi státem a společnostmi s majetkovou účastí státu mají probíhat za tržních podmínek a mají být kontrolovány správním orgánem společnosti. Pokud má stát ve společnosti dominantní postavení, neměl by ho zneužívat.", "color": "#AF1953"}, {"title": "Transparentnost", "lines": ["Transparentnost"], "text": "Společnosti s majetkovou účastí státu by měly zveřejňovat všechny významné skutečnosti, a to v souladu s mezinárodními standardy pro zveřejňování informací. Mezi informace, které by měly být poskytovány, patří: finanční a provozní výsledky společnosti, údaje o odměňování členů správních orgánů a vedoucích zaměstnanců, informace o transakcích se státem, očekávaná rizika a opatření k řízení těchto rizik, údaje o složení správních orgánů a kvalifikace jejích členů, vč. údajů o výběrových řízeních. Společnosti by měly mít zřízený interní audit, který by posuzoval řízení rizik, kontrolní a řídící procesy. Roční účetní závěrky by měly být kontrolovány nezávislým externím auditem. OECD považuje transparentnost v záležitostech společnosti za nezbytný předpoklad pro odpovědné řízení společností a podstatný aspekt pro jednání státu jako informovaného vlastníka.", "color": "#F47D33"}, {"title": "Správní orgány", "lines": ["Správní", "orgány"], "text": "Stát by měl správním orgánům poskytnout pravomoci v takovém rozsahu, aby jim umožnil odpovědně řídit společnosti. Správní orgány by měly mít stanovený jasný mandát a stát by jim měl určit odpovědnost za výsledky společnosti. OECD doporučuje, aby měly správní orgány přesně vymezené úkoly a povinnosti, které budou stanoveny v souladu se zákony upravujícími činnost soukromých společností.\n\nČlenové správních orgánů mají svou činnost vykonávat v souladu se zájmy podniku a akcionářů, jednat v dobré víře a s náležitou péčí. Odpovědnost členů správních orgánů má být totožná, tj. bez ohledu na jmenování člena správního orgánu státem nebo společníkem.\n\nDle OECD má mít správní orgán pravomoc jmenovat a odvolat generálního ředitele společnosti. Jako klíčová funkce správního orgánu je uvedena pravomoc jmenovat a odvolávat výkonné ředitele společnosti. Pokud správní orgán touto pravomocí nedisponuje, je pro něj obtížné odpovídat za výkonnost společnosti.\n\nSprávní orgány by měly svou funkci plnit tím, že budou aktivně formulovat, stanovovat a přezkoumávat cíle společnosti, určovat ukazatele výkonnosti a formulovat významná rizika, vypracovávat postupy řízení rizik, zajišťovat komunikaci a zveřejňování údajů o výsledcích společnosti, rozhodovat o odměňování vedoucích zaměstnanců vč. generálního ředitele.\n\nČlenové správních orgánů mají být vybíráni na základě kvalifikace pro oblast, v které společnosti působí. OECD doporučuje při složení správních orgánů dbát na zachování zásady rozmanitosti – vč. ohledu na vzdělání, pohlaví a věk.\n\nMěly by být však zároveň stanoveny mechanismy pro hodnocení činnosti a nezávislosti správního orgánu – zejména pokud se jedná o omezení počtu opětovných jmenování, omezení počtu pozic, které může člen zastávat.", "color": "#FDC300"}, {"title": "Udržitelnost", "lines": ["Udržitelnost"], "text": "Stát by měl vytvářet podmínky, které společnostem umožní vykonávat jejich činnost způsobem, jenž bude dbát na udržitelnost a dlouhodobé vytváření hodnot. Stát by měl pro společnosti s majetkovou účastí státu vypracovat strategii, která bude obsahovat nástroje k dosažení udržitelného hospodářství. Strategie by měly vzniknout na základě konzultací s příslušnými státními úřady a zapojenými subjekty a měly by být součástí vlastnické politiky státu. Stát by měl pravidelně sledovat a vyhodnocovat plnění společností v oblasti udržitelnosti a reporting začlenit do pravidelného podávání zpráv o celkové výkonnosti společností.\n\nSpolečnosti s majetkovou účastí státu by měly do systémů řízení rizik začlenit i rizika spojená s udržitelností. Systém řízení rizik by měl určit rizika významná pro daný podnik, měl by předcházet nepříznivým dopadům na společnost a zmírňovat je.", "color": "#007FA1"}];
const ns='http://www.w3.org/2000/svg',group=document.getElementById('segments'),wheel=document.getElementById('wheel'),detail=document.getElementById('detail'),content=document.getElementById('content'),title=document.getElementById('title'),index=document.getElementById('index'),controls=document.getElementById('controls'),count=areas.length;let selected=null;
function point(r,a){const t=a*Math.PI/180;return [300+r*Math.cos(t),300+r*Math.sin(t)]}function node(tag,attrs){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
// Okraje sousedních výsečí jsou rovnoběžné přímky vzdálené 5 jednotek SVG.
function edgePoint(radius,angle,offset){const a=angle*Math.PI/180,t=Math.sqrt(radius*radius-offset*offset);return [300+t*Math.cos(a)-offset*Math.sin(a),300+t*Math.sin(a)+offset*Math.cos(a)]}
areas.forEach((area,i)=>{const start=-90-180/count+i*360/count,end=start+360/count,mid=start+180/count,halfGap=2.5,a=edgePoint(265,start,halfGap),b=edgePoint(265,end,-halfGap),c=edgePoint(129,end,-halfGap),d=edgePoint(129,start,halfGap);const wrapper=node('g',{class:'wedge'});const angle=mid*Math.PI/180;wrapper.style.setProperty('--dx',`${6*Math.cos(angle)}px`);wrapper.style.setProperty('--dy',`${6*Math.sin(angle)}px`);const p=node('path',{d:`M ${a} A 265 265 0 0 1 ${b} L ${c} A 129 129 0 0 0 ${d} Z`,fill:area.color,class:'segment',tabindex:'0',role:'button','aria-label':area.title,'aria-pressed':'false','aria-controls':'detail'});p.addEventListener('click',()=>select(i));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i)}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const j=(i+(e.key==='ArrowRight'?1:count-1))%count;select(j);group.querySelectorAll('.segment')[j].focus()}});wrapper.appendChild(p);const [x,y]=point(196,mid);const text=node('text',{x,y:y-(area.lines.length-1)*11,class:'wheeltext','aria-hidden':'true'});area.lines.forEach((line,j)=>{const t=node('tspan',{x,dy:j?22:0});t.textContent=line;text.appendChild(t)});wrapper.appendChild(text);group.appendChild(wrapper)});
function updateSelection(){wheel.classList.toggle('has-selection',selected!==null);group.querySelectorAll('.segment').forEach((p,j)=>{p.setAttribute('aria-pressed',j===selected?'true':'false');p.parentElement.classList.toggle('is-selected',j===selected)})}
function select(i){selected=i;detail.classList.remove('is-empty');detail.style.setProperty('--selected',areas[i].color);title.textContent=areas[i].title;index.hidden=false;controls.hidden=false;index.textContent=`${String(i+1).padStart(2,'0')} / ${String(count).padStart(2,'0')}`;content.replaceChildren();areas[i].text.split('\n\n').forEach((block,j)=>{if(i===0&&j===1){const ul=document.createElement('ul');block.split('\n').forEach(line=>{const li=document.createElement('li');li.textContent=line;ul.appendChild(li)});content.appendChild(ul)}else{const p=document.createElement('p');p.textContent=block;content.appendChild(p)}});content.scrollTop=0;updateSelection()}
function reset(){selected=null;detail.classList.add('is-empty');detail.style.removeProperty('--selected');title.textContent='Prozkoumejte jednotlivé principy';index.hidden=true;index.textContent='';controls.hidden=true;const p=document.createElement('p');p.textContent='Klikněte na některou výseč kruhu a zobrazte si podrobnosti k vybrané oblasti. Kliknutím mimo kruh se vrátíte k tomuto přehledu.';content.replaceChildren(p);content.scrollTop=0;updateSelection()}

document.addEventListener('click',e=>{if(selected===null||e.target.closest('.nav'))return;let inside=false;if(wheel.contains(e.target)){const matrix=wheel.getScreenCTM();if(matrix){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse());inside=Math.hypot(p.x-300,p.y-300)<=277}}if(!inside)reset()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected!==null){const former=selected;const focusOnControl=controls.contains(document.activeElement);reset();if(focusOnControl)group.querySelectorAll('.segment')[former].focus()}});
